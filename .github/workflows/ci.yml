name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land without a code change; surface them on main rather than
  # on whichever unrelated pull request happens to run next.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The live suite talks to the real API and stays ignored here.
  HACKMD_RUN_LIVE_TESTS: ""

jobs:
  test:
    # The three platforms differ in exactly the place this server touches the
    # filesystem: the state directory, its permissions, and path canonicalization.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked

  lint:
    # Pinned: clippy pedantic under -D warnings would otherwise let any new
    # stable release fail main with no code change. Bump it in its own commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # The default build compiles the non-otel observability path.
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    # Turns the rust-version in Cargo.toml into a tested claim rather than an
    # assertion. Build only: dev-dependencies are free to need something newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # cargo audit itself rather than rustsec/audit-check, whose releases
      # still run on Node.js 20. Pinned like the lint toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
