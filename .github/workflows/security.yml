name: Security

# Advisories land without a code change, so this runs on a clock rather than
# on pushes. ci.yml still audits every push and pull request, and gates the
# release on it; this is the run that notices a new advisory between them.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit@0.22.2
      # Same flags as ci.yml: unsound and yanked crates fail like vulnerabilities.
      - run: cargo audit --deny warnings
