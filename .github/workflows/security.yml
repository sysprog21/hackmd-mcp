name: Security

# The one definition of the RustSec audit. ci.yml calls it on every push and
# pull request and gates the release on it; the clock below notices a new
# advisory between those runs, since advisories land without a code change.
# Ignore an advisory by ID in .cargo/audit.toml rather than drop --deny.
on:
  workflow_call:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.2
      # Unsound and yanked crates fail like vulnerabilities.
      - run: cargo audit --deny warnings
