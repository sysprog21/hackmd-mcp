[package]
name = "hackmd-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-first MCP server for the HackMD API"

[dependencies]
rmcp = { version = "3", default-features = false, features = ["macros", "server", "transport-io"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
