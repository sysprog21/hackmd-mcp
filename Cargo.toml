[package]
name = "hackmd-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-first MCP server for the HackMD API"

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
cap-std = "4"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
directories = "6"
fastrand = "2"
httpdate = "1"
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rmcp = { version = "3", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util = "0.3"
rmcp = { version = "3", default-features = false, features = ["client", "transport-worker"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
